<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect width="1200" height="60" fill="#2c3e50"/>
  <text x="20" y="40" font-family="Arial" font-size="24" fill="#ffffff">🎓 QCM Informatique</text>
  <text x="1000" y="40" font-family="Arial" font-size="16" fill="#ffffff">Bonjour Jean</text>
  <text x="1100" y="40" font-family="Arial" font-size="16" fill="#ffffff">Déconnexion</text>
  
  <!-- Results Container -->
  <rect x="200" y="100" width="800" height="600" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="600" y="160" font-family="Arial" font-size="32" fill="#2c3e50" text-anchor="middle" font-weight="bold">Vos résultats</text>
  
  <!-- Score Card -->
  <rect x="300" y="200" width="600" height="150" rx="15" fill="url(#grad1)"/>
  <text x="600" y="280" font-family="Arial" font-size="48" fill="#ffffff" text-anchor="middle" font-weight="bold">16 / 20</text>
  <text x="600" y="330" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle">8 bonne(s) réponse(s) sur 10</text>
  
  <!-- Detail Section -->
  <text x="250" y="400" font-family="Arial" font-size="20" fill="#2c3e50" font-weight="bold">Détail des réponses</text>
  
  <!-- Correct Answer -->
  <rect x="250" y="430" width="700" height="80" rx="8" fill="#e8f8e8" stroke="#27ae60" stroke-width="3"/>
  <text x="270" y="460" font-family="Arial" font-size="16" fill="#2c3e50" font-weight="bold">Q1. Quel composant est le cerveau de l'ordinateur ?</text>
  <text x="270" y="495" font-family="Arial" font-size="14" fill="#27ae60" font-weight="bold">✅ Bonne réponse : CPU</text>
  
  <!-- Incorrect Answer -->
  <rect x="250" y="530" width="700" height="100" rx="8" fill="#fde8e8" stroke="#e74c3c" stroke-width="3"/>
  <text x="270" y="560" font-family="Arial" font-size="16" fill="#2c3e50" font-weight="bold">Q2. Que signifie RAM ?</text>
  <text x="270" y="590" font-family="Arial" font-size="14" fill="#e74c3c" font-weight="bold">Votre réponse : Read Access Memory</text>
  <text x="270" y="615" font-family="Arial" font-size="14" fill="#27ae60" font-weight="bold">Bonne réponse : Random Access Memory</text>
  
  <!-- Buttons -->
  <rect x="250" y="650" width="300" height="45" rx="8" fill="url(#buttonGrad)"/>
  <text x="400" y="682" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Refaire un QCM</text>
  
  <rect x="570" y="650" width="300" height="45" rx="8" fill="#ecf0f1"/>
  <text x="720" y="682" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Mon historique</text>
  
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="30" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>