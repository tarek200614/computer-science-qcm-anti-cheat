<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect width="1200" height="60" fill="#2c3e50"/>
  <text x="20" y="40" font-family="Arial" font-size="24" fill="#ffffff">🎓 QCM Informatique</text>
  <text x="1000" y="40" font-family="Arial" font-size="16" fill="#ffffff">Bonjour Jean</text>
  <text x="1100" y="40" font-family="Arial" font-size="16" fill="#ffffff">Déconnexion</text>
  
  <!-- Content -->
  <rect x="100" y="100" width="1000" height="600" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="600" y="160" font-family="Arial" font-size="32" fill="#2c3e50" text-anchor="middle" font-weight="bold">Mon historique</text>
  
  <!-- Stats Box -->
  <rect x="200" y="200" width="800" height="80" rx="10" fill="url(#grad1)"/>
  <text x="600" y="250" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">Moyenne générale : 14.5 / 20 (5 tentative(s))</text>
  
  <!-- Table -->
  <rect x="200" y="320" width="800" height="300" rx="10" fill="#f8f9fa"/>
  <rect x="200" y="320" width="800" height="50" rx="10" fill="#2c3e50"/>
  <text x="250" y="355" font-family="Arial" font-size="16" fill="#ffffff" font-weight="bold">Tentative</text>
  <text x="500" y="355" font-family="Arial" font-size="16" fill="#ffffff" font-weight="bold">Date</text>
  <text x="850" y="355" font-family="Arial" font-size="16" fill="#ffffff" font-weight="bold">Score</text>
  
  <!-- Table Rows -->
  <rect x="220" y="390" width="760" height="40" fill="#ffffff"/>
  <text x="250" y="418" font-family="Arial" font-size="14" fill="#333">5</text>
  <text x="500" y="418" font-family="Arial" font-size="14" fill="#333">30/07/2026 14:30</text>
  <text x="850" y="418" font-family="Arial" font-size="14" fill="#333">16 / 20</text>
  
  <rect x="220" y="440" width="760" height="40" fill="#ffffff"/>
  <text x="250" y="468" font-family="Arial" font-size="14" fill="#333">4</text>
  <text x="500" y="468" font-family="Arial" font-size="14" fill="#333">29/07/2026 10:15</text>
  <text x="850" y="468" font-family="Arial" font-size="14" fill="#333">14 / 20</text>
  
  <rect x="220" y="490" width="760" height="40" fill="#ffffff"/>
  <text x="250" y="518" font-family="Arial" font-size="14" fill="#333">3</text>
  <text x="500" y="518" font-family="Arial" font-size="14" fill="#333">28/07/2026 16:45</text>
  <text x="850" y="518" font-family="Arial" font-size="14" fill="#333">13 / 20</text>
  
  <!-- Button -->
  <rect x="450" y="650" width="300" height="50" rx="8" fill="url(#buttonGrad)"/>
  <text x="600" y="682" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Nouveau QCM</text>
  
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="30" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>