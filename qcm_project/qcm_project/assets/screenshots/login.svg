<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect width="1200" height="60" fill="#2c3e50"/>
  <text x="600" y="40" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">🎓 QCM Informatique</text>
  
  <!-- Login Form -->
  <rect x="375" y="200" width="450" height="400" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="600" y="260" font-family="Arial" font-size="28" fill="#2c3e50" text-anchor="middle" font-weight="bold">Connexion</text>
  
  <!-- Form Fields -->
  <rect x="420" y="320" width="360" height="45" rx="8" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="2"/>
  <text x="435" y="350" font-family="Arial" font-size="14" fill="#999">Email</text>
  
  <rect x="420" y="390" width="360" height="45" rx="8" fill="#f0f0f0" stroke="#e0e0e0" stroke-width="2"/>
  <text x="435" y="420" font-family="Arial" font-size="14" fill="#999">Mot de passe</text>
  
  <!-- Submit Button -->
  <rect x="420" y="470" width="360" height="50" rx="8" fill="url(#buttonGrad)"/>
  <text x="600" y="502" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Se connecter</text>
  
  <!-- Link -->
  <text x="600" y="560" font-family="Arial" font-size="14" fill="#667eea" text-anchor="middle">Pas de compte ? S'inscrire</text>
  
  <defs>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="30" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>