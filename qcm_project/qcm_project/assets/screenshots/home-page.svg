<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect width="1200" height="60" fill="#2c3e50"/>
  <text x="600" y="40" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">🎓 QCM Informatique</text>
  
  <!-- Hero Section -->
  <rect x="200" y="150" width="800" height="500" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="600" y="280" font-family="Arial" font-size="36" fill="#2c3e50" text-anchor="middle" font-weight="bold">Testez vos connaissances en informatique</text>
  <text x="600" y="330" font-family="Arial" font-size="18" fill="#666" text-anchor="middle">10 questions aléatoires · Chronomètre · Résultats détaillés</text>
  
  <!-- Buttons -->
  <rect x="450" y="400" width="150" height="50" rx="8" fill="url(#buttonGrad)"/>
  <text x="525" y="432" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle">Commencer</text>
  
  <rect x="620" y="400" width="150" height="50" rx="8" fill="#ecf0f1"/>
  <text x="695" y="432" font-family="Arial" font-size="16" fill="#333" text-anchor="middle">Se connecter</text>
  
  <defs>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="30" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>