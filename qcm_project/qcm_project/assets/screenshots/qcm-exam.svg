<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Header -->
  <rect width="1200" height="60" fill="#2c3e50"/>
  <text x="20" y="40" font-family="Arial" font-size="24" fill="#ffffff">🎓 QCM Informatique</text>
  <text x="1000" y="40" font-family="Arial" font-size="16" fill="#ffffff">Bonjour Jean</text>
  <text x="1100" y="40" font-family="Arial" font-size="16" fill="#ffffff">Déconnexion</text>
  
  <!-- QCM Container -->
  <rect x="200" y="100" width="800" height="600" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Timer Header -->
  <rect x="220" y="120" width="760" height="60" rx="8" fill="#f8f9fa"/>
  <text x="250" y="158" font-family="Arial" font-size="20" fill="#2c3e50" font-weight="bold">⏱ 08:45</text>
  <text x="850" y="158" font-family="Arial" font-size="18" fill="#2c3e50">Question 3/10</text>
  
  <!-- Question -->
  <text x="250" y="220" font-family="Arial" font-size="22" fill="#2c3e50" font-weight="bold">Q3. Quel composant est le cerveau de l'ordinateur ?</text>
  
  <!-- Answers -->
  <rect x="250" y="260" width="700" height="50" rx="8" fill="#f0f4ff" stroke="#667eea" stroke-width="2"/>
  <circle cx="280" cy="285" r="10" fill="#667eea"/>
  <text x="310" y="292" font-family="Arial" font-size="16" fill="#333">RAM</text>
  
  <rect x="250" y="330" width="700" height="50" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="280" cy="355" r="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <text x="310" y="362" font-family="Arial" font-size="16" fill="#333">CPU</text>
  
  <rect x="250" y="400" width="700" height="50" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="280" cy="425" r="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <text x="310" y="432" font-family="Arial" font-size="16" fill="#333">GPU</text>
  
  <rect x="250" y="470" width="700" height="50" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <circle cx="280" cy="495" r="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  <text x="310" y="502" font-family="Arial" font-size="16" fill="#333">SSD</text>
  
  <!-- Navigation -->
  <rect x="250" y="580" width="150" height="45" rx="8" fill="#ecf0f1"/>
  <text x="325" y="610" font-family="Arial" font-size="16" fill="#666" text-anchor="middle">← Précédent</text>
  
  <rect x="800" y="580" width="150" height="45" rx="8" fill="url(#buttonGrad)"/>
  <text x="875" y="610" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Suivant →</text>
  
  <defs>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="30" flood-opacity="0.2"/>
    </filter>
  </defs>
</svg>