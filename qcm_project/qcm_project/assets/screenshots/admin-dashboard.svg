<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#f5f7fa"/>
  
  <!-- Sidebar -->
  <rect width="250" height="800" fill="url(#sidebarGrad)"/>
  <text x="125" y="60" font-family="Arial" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">⚙️ Admin</text>
  
  <rect x="20" y="100" width="210" height="40" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="125" y="128" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle">Tableau de bord</text>
  
  <text x="125" y="180" font-family="Arial" font-size="16" fill="#bdc3c7" text-anchor="middle">Utilisateurs</text>
  <text x="125" y="230" font-family="Arial" font-size="16" fill="#bdc3c7" text-anchor="middle">Questions</text>
  <text x="125" y="280" font-family="Arial" font-size="16" fill="#bdc3c7" text-anchor="middle">← Site</text>
  
  <!-- Main Content -->
  <rect x="270" y="80" width="910" height="700" rx="15" fill="#ffffff" filter="url(#shadow)"/>
  <text x="725" y="140" font-family="Arial" font-size="32" fill="#2c3e50" text-anchor="middle" font-weight="bold">Tableau de bord</text>
  
  <!-- Stats Cards -->
  <rect x="320" y="180" width="350" height="150" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
  <text x="495" y="260" font-family="Arial" font-size="48" fill="#667eea" text-anchor="middle" font-weight="bold">25</text>
  <text x="495" y="310" font-family="Arial" font-size="18" fill="#666" text-anchor="middle" text-transform="uppercase" letter-spacing="1">Utilisateurs</text>
  
  <rect x="780" y="180" width="350" height="150" rx="12" fill="#ffffff" filter="url(#cardShadow)"/>
  <text x="955" y="260" font-family="Arial" font-size="48" fill="#667eea" text-anchor="middle" font-weight="bold">100</text>
  <text x="955" y="310" font-family="Arial" font-size="18" fill="#666" text-anchor="middle" text-transform="uppercase" letter-spacing="1">Questions</text>
  
  <!-- Quick Links -->
  <rect x="320" y="380" width="350" height="50" rx="8" fill="url(#buttonGrad)"/>
  <text x="495" y="412" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Gérer les utilisateurs</text>
  
  <rect x="780" y="380" width="350" height="50" rx="8" fill="url(#buttonGrad)"/>
  <text x="955" y="412" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Gérer les questions</text>
  
  <!-- Recent Activity Table -->
  <text x="320" y="480" font-family="Arial" font-size="20" fill="#2c3e50" font-weight="bold">Activité récente</text>
  
  <rect x="320" y="510" width="810" height="200" rx="10" fill="#f8f9fa"/>
  <rect x="320" y="510" width="810" height="40" rx="10" fill="#2c3e50"/>
  <text x="350" y="538" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold">Utilisateur</text>
  <text x="600" y="538" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold">Action</text>
  <text x="900" y="538" font-family="Arial" font-size="14" fill="#ffffff" font-weight="bold">Date</text>
  
  <rect x="340" y="570" width="770" height="35" fill="#ffffff"/>
  <text x="350" y="595" font-family="Arial" font-size="13" fill="#333">Jean Dupont</text>
  <text x="600" y="595" font-family="Arial" font-size="13" fill="#333">QCM complété</text>
  <text x="900" y="595" font-family="Arial" font-size="13" fill="#333">30/07/2026</text>
  
  <rect x="340" y="615" width="770" height="35" fill="#ffffff"/>
  <text x="350" y="640" font-family="Arial" font-size="13" fill="#333">Marie Martin</text>
  <text x="600" y="640" font-family="Arial" font-size="13" fill="#333">Inscription</text>
  <text x="900" y="640" font-family="Arial" font-size="13" fill="#333">30/07/2026</text>
  
  <rect x="340" y="660" width="770" height="35" fill="#ffffff"/>
  <text x="350" y="685" font-family="Arial" font-size="13" fill="#333">Admin</text>
  <text x="600" y="685" font-family="Arial" font-size="13" fill="#333">Question ajoutée</text>
  <text x="900" y="685" font-family="Arial" font-size="13" fill="#333">29/07/2026</text>
  
  <defs>
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a252f"/>
      <stop offset="100%" style="stop-color:#2c3e50"/>
    </linearGradient>
    <linearGradient id="buttonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="30" flood-opacity="0.2"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="15" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>