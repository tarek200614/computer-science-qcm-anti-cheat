<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="60" rx="10" fill="url(#grad1)"/>
  
  <!-- Graduation Cap Icon -->
  <g transform="translate(15, 10)">
    <polygon points="15,25 5,20 15,15 25,20" fill="#ffffff"/>
    <polygon points="5,20 5,30 15,35 25,30 25,20" fill="#ffffff" opacity="0.8"/>
    <rect x="3" y="18" width="24" height="3" fill="#ffffff"/>
    <circle cx="15" cy="35" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">QCM Info</text>
